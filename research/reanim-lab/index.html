<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOTY Reanim — Phase 0 研究播放器</title></head>
<body><h1>GOTY Reanim 研究播放器</h1><p>仅用于原资源/矩阵/时间轴核查。下方控件是研究仪器，不是正式游戏 UI；没有生产存档或 AI。</p>
<div id="controls"><label>临时高度 <select id="height"></select></label><button id="load">载入 .99 状态</button><button id="feed">测试施肥</button><button id="pause">暂停</button><button id="step">推进 1 tick</button><label><input type="checkbox" id="clouds" checked>六云独立调度</label><label><input type="checkbox" id="voice">原版音效</label><label>采样 <select id="sampling"><option value="linear">linear</option><option value="nearest">nearest</option></select></label></div>
<div id="canvas"></div><label>主动画全局帧 <input id="frame" type="range" min="0" max="353" step="0.01" value="18"></label><pre id="status">加载原版私有资源…</pre>
<script type="module" src="/src/main.ts"></script></body></html>
